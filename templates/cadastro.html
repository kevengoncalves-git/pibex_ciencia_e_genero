<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta | Ciência e Gênero</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth_style.css') }}">
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/logo-pibex-site.jpg') }}">
</head>
<body>

<div class="container">

  <a href="/" class="btn-back">&larr; Voltar para o início</a>

  <div class="card">

    <div class="card-top">
      <h2>Criar Conta</h2>
      <p>Plataforma Ciência e Gênero</p>
    </div>

    <form class="card-body" id="cadastroForm" novalidate>

      <div class="alert" id="alertBox"></div>

      <label for="nome">Nome Completo:</label>
      <div class="input-box">
        <span>👤</span>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
      </div>

      <label for="email">E-mail:</label>
      <div class="input-box">
        <span>✉️</span>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
      </div>

      <label for="senha">Senha:</label>
      <div class="input-box">
        <span>🔒</span>
        <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required minlength="6">
      </div>

      <label for="confirmarSenha">Confirmar Senha:</label>
      <div class="input-box">
        <span>🔒</span>
        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" required minlength="6">
      </div>

      <button type="submit" id="submitBtn">Criar minha conta</button>

      <p class="auth-switch">Já tem conta? <a href="/login">Entrar</a></p>

    </form>

  </div>

</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>
</html>
